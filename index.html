<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>티메 (Ti-Me)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="blob-container">
    <div class="blob"></div>
  </div>

  <div id="home-screen">
    <h1>티메</h1>
    <p>내 티어 & 랭킹 리스트 모음</p>
    
    <div class="project-list" id="project-list">
      </div>
    
    <button id="new-project-btn" class="fab">+</button>
  </div>

  <div id="workspace-screen" style="display: none;">
    <div class="header">
      <button id="back-btn">⬅</button>
      <h2 id="current-project-title">주제 이름</h2>
    </div>

    <div class="add-section">
      <input type="text" id="item-name" placeholder="후보 이름">
      <input type="file" id="item-image" accept="image/*">
      <input type="text" id="item-memo" placeholder="선정 이유 (메모)">
      <button id="add-item-btn">추가</button>
    </div>

    <div class="pool" id="item-pool" data-tier="pool"></div>

    <div id="tier-mode" class="mode-area">
      <div class="tier-row"><div class="tier-label S">S</div><div class="tier-items" data-tier="S"></div></div>
      <div class="tier-row"><div class="tier-label A">A</div><div class="tier-items" data-tier="A"></div></div>
      <div class="tier-row"><div class="tier-label B">B</div><div class="tier-items" data-tier="B"></div></div>
      <div class="tier-row"><div class="tier-label C">C</div><div class="tier-items" data-tier="C"></div></div>
    </div>

    <div id="ranking-mode" class="mode-area" style="display: none;">
      <p style="margin-bottom:10px; font-size:14px; color:#666;">※ 아이템을 끌어다 순서를 맞춰보세요!</p>
      <div class="ranking-list" id="ranking-list" data-tier="ranking">
        </div>
    </div>

    <div class="bottom-nav">
      <button id="nav-tier" class="active">티어</button>
      <button id="nav-ranking">랭킹</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
